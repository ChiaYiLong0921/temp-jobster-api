version: '3.8'

services:
  jobster-api:
    build: .
    container_name: jobster_api
    restart: always
    ports:
      - "8080:8080"
    # This pulls your existing .env file into the container
    env_file:
      - .env
    # We add this so the container can talk to the Postgres service running on your Pi
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/v1/health"]
      interval: 30s    # How often to check
      timeout: 10s     # How long to wait for a response
      retries: 3       # How many failures before marking as 'unhealthy'
      start_period: 20s # Give the app 20s to boot up before checking
