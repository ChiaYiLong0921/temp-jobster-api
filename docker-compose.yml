version: '3.8'

services:
  jobster-api:
    build: .
    container_name: jobster_api
    restart: always
    ports:
      - "8080:8080"
    # This pulls your existing .env file into the container
    env_file:
      - .env
    # We add this so the container can talk to the Postgres service running on your Pi
    extra_hosts:
      - "host.docker.internal:host-gateway"